<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <title>Contato - Padaria do Sr. José</title>
</head>
<body>
    
     <header>
        <!-- Cabeçalho do site -->
    <img
    src="./images/logo.png" 
    alt="Logo image" 
    width="70" height="50"
    >
    <nav>
        <ul>
            <li> <a href="index.html">Início</a> </li>
            <li> <a href="index.html#produto">Produto</a> </li>
            <li> <a href="contato.html">Contato</a> </li>
            <li> <a href="index.html#diferenciais">Diferenciais</a> </li>
            <li> <a href="index.html#sobre">Sobre</a> </li>
        </ul>
    </nav>
    </header>
    <h1>Fale Conosco!</h1>
    <p>Tem alguma dúvida ou sugestão? Entre em contato conosco!</p>
        <form>
            <fieldset border="1">
            <legend>Seus Dados:</legend>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">

            <br>
            <br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">
            
            <br>
            <br>
            
            <label for="telefone">Telefone:</label>
            <input type="tel" 
            id="telefone" 
            name="telefone"
            placeholder="Digite seu telefone"
            pattern="\{[0-9]{2}\}[0-9]{5}-[0-9]{4}">
            </fieldset>

            <fieldset>
            <legend>Mensagem:</legend>
            <label for="assunto">Assunto:</label>

            <select id="assunto" name="assunto">
                <option value="">>---Selecione---<</option>
                <option value="duvida">Dúvida</option>
                <option value="sugestao">Sugestão</option>
                <option value="elogio">Elogio</option>
                <option value="reclamacao">Reclamação</option>
            </select>
            <br>
            <br>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem"></textarea>
            </fieldset>
            <button type="submit">Enviar Mensagem</button>
        </form>


    <footer>
        <p>&copy; 2023 Padaria do Sr. José. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
