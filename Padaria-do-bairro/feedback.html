<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedBack</title>
</head>
<body>
    <header>
        <!-- Cabeçalho do site -->
    <img
    src="./images/logo.png" 
    alt="Logo image" 
    width="70" height="50"
    >
    <nav>
        <ul>
            <li> <a href="index.html">inicio</a> </li>
            <li> <a href="index.html#sobre">Sobre</a> </li>
            <li> <a href="index.html#produto">Produto</a> </li>
            <li> <a href="contato.html">Contato</a> </li>
            <li> <a href="index.html#diferenciais">Diferenciais</a> </li>
            <li> <a href="pedidos.html">Faça seu Pedidos</a> </li>
        </ul>
    </nav>
    </header>
    <main>
        <h2>Deixe seu Feedback!</h2>
        <p>Preencha seus dados e nos diga o que achou do nosso serviço</p>
        <br>
        <form>
            <fieldset border="1">
            <legend>1. Seus Dados:</legend>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">

            <br>
            <br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">
            
            <br>
            <br>
            
            <label for="telefone">Telefone:</label>
            <input type="tel" 
            id="telefone" 
            name="telefone"
            placeholder="Digite seu telefone"
            pattern="\{[0-9]{2}\}[0-9]{5}-[0-9]{4}">

            <br>
            <br>

            <fieldset>
                <legend>Sua Avaliação:</legend>
                <label for="Produto">Sobre qual produto ou serviço:</label>
                <select id="sabor" name="sabor">
                <option value="">>---Selecione---<</option>
                <option value="chocolate">Chocolate</option>
                <option value="morango">Morango</option>
                <option value="baunilha">Baunilha</option>
                <option value="frango">Salgado(Frango)</option>
                <option value="misto">Salgado(misto)</option>
                <option value="carne">Salgado(carne)</option>
            </select>
            <p><strong>Avaliação Geral:</strong></p>
            <input type="radio" id="excelente" name="avaliacao" value="excelente">
            <label for="excelente">Excelente</label><br>
            <input type="radio" id="bom" name="avaliacao" value="bom">
            <label for="bom">Bom</label><br>
            <input type="radio" id="regular" name="avaliacao" value="regular">
            <label for="regular">Regular</label><br>
            <input type="radio" id="ruim" name="avaliacao" value="ruim">
            <label for="ruim">Ruim</label><br>

            <br>
            <br>
            <label for="comentario">Comentário:</label><br>
            <textarea id="comentario" name="comentario" rows="5" cols="40"
            placeholder="Conte para nós a sua Experiência"></textarea>


            </fieldset>

            <button type="submit">Enviar Feedback</button>

            <br>
            <br>

            <footer>
                <p>© 2024 Padaria do Bairro. Todos os direitos reservados.</p>
            </footer>
        </form>
    </main>
</body>
</html>
