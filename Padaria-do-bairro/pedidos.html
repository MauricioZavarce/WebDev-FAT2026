<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
</head>
<body>
    <header>
        <!-- Cabeçalho do site -->
    <img
    src="./images/logo.png" 
    alt="Logo image" 
    width="70" height="50"
    >
    <nav>
        <ul>
            <li> <a href="index.html">inicio</a> </li>
            <li> <a href="index.html#sobre">Sobre</a> </li>
            <li> <a href="index.html#produto">Produto</a> </li>
            <li> <a href="index.html#diferenciais">Diferenciais</a> </li>
            <li> <a href="contato.html">Contato</a> </li>
            
            
        </ul>
    </nav>
    </header>

    <main>
        <h2>Faça seu pedido!</h2>
        <p>Preencha seus dados e personalize seu pedido</p>

        <form>
            <fieldset border="1">
            <legend>1. Seus Dados:</legend>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">

            <br>
            <br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">
            
            <br>
            <br>
            
            <label for="telefone">Telefone:</label>
            <input type="tel" 
            id="telefone" 
            name="telefone"
            placeholder="Digite seu telefone"
            pattern="\{[0-9]{2}\}[0-9]{5}-[0-9]{4}">

            <br>
            <br>
            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" placeholder="Digite seu CEP" required
            pattern="\{[0-9]{5}\}[0-9]{5}-[0-9]{3}">

            <br>
            <br>
            <label for="rua">Rua:</label>
            <input type="text" id="rua" name="rua" placeholder="Digite o nome da sua rua" required>

            <br>
            <br>
            <label for="numero">Número:</label>
            <input type="text" id="numero" name="numero" placeholder="Digite o número da sua residência" required>

            <br>
            <br>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro" placeholder="Digite o nome do seu bairro" required>

            <br>
            <br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Digite o nome da sua cidade" required>

            <br>
            <br>
            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
                <option value="">>---Selecione---<</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="BA">Bahia</option>
                <option value="DF">Distrito Federal</option>
                <option value="MG">Minas Gerais</option>
                
                <option value="RJ">Rio de Janeiro</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                
            </fieldset>

            <br>
            <br>

            <fieldset>
            <legend>2 . Detalhes do Pedido:</legend>
            <strong>Tipo de produto:</strong>
            <label><br>
                <input type="radio" id="produto" name="produto" value="bolo">
                    Bolo
                </input><br>
            </label>
            <label>
                <input type="radio" id="produto" name="produto" value="torta">
                    Torta
                </input><br>
            </label>
            <label>
                <input type="radio" id="produto" name="produto" value="salgado">
                    Salgado
                </input><br>
            </label>
            <br>
            <br>
            <label for="sabor">Sabor/Recheio</label>
            <select id="sabor" name="sabor">
                <option value="">>---Selecione---<</option>
                <option value="chocolate">Chocolate</option>
                <option value="morango">Morango</option>
                <option value="baunilha">Baunilha</option>
                <option value="frango">Salgado(Frango)</option>
                <option value="misto">Salgado(misto)</option>
                <option value="carne">Salgado(carne)</option>
            </select>
            <br>
            <br>
            <strong>Tamanho:</strong>
            <label><br>
                <input type="radio" id="tamanho" name="tamanho" value="pequeno">
                    Pequeno
                </input><br>
            </label>
            <label>
                <input type="radio" id="tamanho" name="tamanho" value="medio">
                   Médio
                </input><br>
            </label>
            <label>
                <input type="radio" id="tamanho" name="tamanho" value="grande">
                    Grande
                </input><br>
            </label>
            <br><br>
            <label for="data">Data de Entrega:</label>
            <input type="date" id="data" name="data">

            </fieldset>   
            
            <br>
            <br>
            <fieldset>
            <legend>3. Informações Adicionais</legend>
            <label for="obs">Observações Especiais</label>
            <textarea id="obs" name="obs" rows="4" cols="50" placeholder="Digite suas observações especiais aqui..."></textarea>
            </fieldset>
            <button>Enviar seu Pedido</button>
        </form>

    </main>

    <footer>
        <p>&copy; 2023 Padaria do Sr. José. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
