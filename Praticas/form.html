<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./form.css" />
    <title>Formulários</title>
</head>
<body>
    <h3>Formulários de cadastro</h3>
    <main>
        <form class="form">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome">
            <br>
            <label for="sobrenome">Sobrenome:</label><br>
            <input type="text" id="sobrenome" name="sobrenome">
            <br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="digite seu email aqui">
            <br>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha"><br>
            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone"><br>
            <label for="data">Data de Nascimento:</label><br>
            <input type="date" id="data" name="data">
            <br>
            <label for="genero">Gênero:</label><br>
            <select id="genero" name="genero">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select>
            <br><br>
            <form class="form">
                <h3>Formulário de Login</h3>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="digite seu email aqui">
            <br>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha"><br>
            <input type="submit" value="Entrar">
            </form>
            <br><br>
            <form class="form-pesquisa">
                <h3>Formulário de Pesquisa</h3>
            <br>
            <label for="email">Buscar Produto:</label>
            <input type="email" id="email" name="email"><br>
            <button type="submit">Pesquisar</button><br><br>
            <label for="color">Cor Favorita</label>
                <input type="color" id="color" name="color">

                <label for="range">Nivel</label>
                <input type="range" id="range" name="range" min="0" max="1000">
            </form>
            <br><br>
                
                <br><br>

            <h3>Campos de Escolha</h3>
            <label for="escolha">Quais linguagens Você Conhece (Pode marcar mais de uma opção)</label><br>
            <input type="checkbox" id="opcao1" name="escolha" value="HTML">
            <label for="opcao1">HTML</label><br>

            <input type="checkbox" id="opcao2" name="escolha" value="CSS">
            <label for="opcao2">CSS</label><br>
            <input type="checkbox" id="JS" name="escolha" value="JavaScript">
            <label for="opcao3">JavaScript</label><br>

            <h3>Qual o Seu Nivel</h3>
            <input type="radio" id="iniciante" name="nivel" value="iniciante">
            <label for="iniciante">Iniciante</label>
            <input type="radio" id="intermediario" name="nivel" value="intermediario">
            <label for="intermediario">Intermediário</label>
            
            <input type="radio" id="Avançado" name="nivel" value="Avançado">
            <label for="Avançado">Avançado</label><br>

            <h3>Escolha seu Curso</h3>
            <label for="curso">Curso:</label>
            <select id="curso" name="curso">
                <option value="">Front-End</option>
                <option value="">Back-End</option>
                <option value="">Full-Stack</option>
            </select>

            <h3>Caixa de Mensagem</h3>

            <label for="mensagem">Mensagem:</label>
            <br>
            <textarea id="mensagem" name="mensagem" 
            rows="4" cols="50">
            </textarea><br>
            <br>
            <input type="submit" value="Enviar Mensagem">
        </form>

    </main>
    
</body>
</html>
