<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários de cadastro</h1>
    <main>
        <form>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome">
            <br>
            <label for="sobrenome">Sobrenome:</label><br>
            <input type="text" id="sobrenome" name="sobrenome">
            <br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="digite seu email aqui">
            <br>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha"><br>
            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone"><br>
            <label for="data">Data de Nascimento:</label><br>
            <input type="date" id="data" name="data">
            <br>
            <label for="genero">Gênero:</label><br>
            <select id="genero" name="genero">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select>
            <br><br>
            <h1>Formulário de Login</h1>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="digite seu email aqui">
            <br>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha"><br>
            <input type="submit" value="Entrar">
            <br><br>
            <h1>Formulário de Pesquisa</h1>
            <br>
            <label for="email">Buscar Produto</label>
            <input type="email" id="email" name="email">
            <button type="submit">Pesquisar</button>
            <br><br>
                <label for="color">Cor Favorita</label>
                <input type="color" id="color" name="color">

                <label for="range">Nivel</label>
                <input type="range" id="range" name="range" min="0" max="1000">
                <br><br>
            <h1>Campos de Escolha</h1>
            <label for="escolha">Escolha uma opção:</label><br>
            <input type="radio" id="opcao1" name="escolha" value="opcao1">
            <label for="opcao1">Opção 1</label><br>    
            <h1>Formulário de Contato</h1>
            <label for="mensagem">Mensagem:</label>
            <br>
            <textarea id="mensagem" name="mensagem" 
            rows="4" cols="50">
            </textarea><br>
            <br>
            <input type="submit" value="Enviar Mensagem">
        </form>

    </main>
    
</body>
</html>
