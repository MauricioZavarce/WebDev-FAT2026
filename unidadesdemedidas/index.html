<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades de Medidas</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Unidade absoluta -->

    <h2>1. px(pixels) - a medida fixa </h2>
        <div class="px-caixa">
            Tenho 300px
        </div>

    <h2>2. %(porcentagem) - a medida relativa ao pai </h2>
    <div class="pai-porcento">
        <div class="filho-50"> Tenho 50% do pais </div>
        <div class="filho-80"> Tenho 80% do pais </div>
    </div>
    
    <h2>3. %(porcentagem) - a medida relativa ao pai </h2>
    <div class="pai-porcento">
        <div class="filho-50"> Tenho 50% do pais </div>
        <div class="filho-80"> Tenho 80% do pais </div>
    </div>    
</body>
</html>
